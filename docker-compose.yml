version: '3.8'

services:
  # --- PostgreSQL: Facturation & Auth Stricte ---
  postgres:
    image: postgres:15-alpine
    container_name: hiremind-postgres
    restart: always
    environment:
      POSTGRES_USER: hiremind_user
      POSTGRES_PASSWORD: hiremind_secure_pass
      POSTGRES_DB: hiremind_auth_billing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- MongoDB: Données Documentaires Métiers ---
  mongodb:
    image: mongo:6.0
    container_name: hiremind-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin_secure_pass
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  # --- Redis: Gestion des files d'attente d'évaluation (Sandbox) & Cache ---
  redis:
    image: redis:7.0-alpine
    container_name: hiremind-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # --- Qdrant: Base de données Vectorielle (Matching Sémantique) ---
  qdrant:
    image: qdrant/qdrant:v1.3.0
    container_name: hiremind-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # --- MinIO: Stockage d'Objets (Fichiers de CV bruts) ---
  minio:
    image: minio/minio:RELEASE.2023-05-18T00-05-36Z
    container_name: hiremind-minio
    restart: always
    ports:
      - "9000:9000"       # API MinIO
      - "9001:9001"       # Console d'administration
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_secure_pass
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  qdrant_data:
  minio_data:
